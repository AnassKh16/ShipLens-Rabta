services:
  app:
    build: .
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      FRONTEND_DIST: /app/frontend/dist
    ports:
      - "8080:3000"
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: rabta
      POSTGRES_DB: rabta
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U rabta -d rabta"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
