services:
  - type: web
    name: rabta
    runtime: docker
    region: singapore
    plan: free
    branch: main
    autoDeployTrigger: commit
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: rabta-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: TZ_DISPLAY
        value: Asia/Karachi
      - key: FRONTEND_DIST
        value: /app/frontend/dist

databases:
  - name: rabta-db
    region: singapore
    plan: free
    postgresMajorVersion: "16"
    databaseName: rabta
    user: rabta
    ipAllowList: []
